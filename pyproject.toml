[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2g-local"
version = "0.1.0"
description = "Source-traceable local A2G knowledge tracing research"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<2.3", "numpy>=1.26,<2", "scikit-learn>=1.3,<1.8"]

[tool.setuptools.packages.find]
where = ["src"]

